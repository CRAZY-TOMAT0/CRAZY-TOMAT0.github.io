<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AI 数字人纪念馆界面示意图">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4ff"/>
      <stop offset="1" stop-color="#f5e8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#c)"/>
  <circle cx="160" cy="560" r="220" fill="#a855f7" opacity=".12"/>

  <!-- Live2D 数字人 -->
  <g transform="translate(140 165)">
    <rect width="330" height="330" rx="24" fill="#fff" opacity=".9"/>
    <ellipse cx="165" cy="130" rx="52" ry="58" fill="#f5d0fe"/>
    <path d="M105 240 q60 -76 120 0 z" fill="#f5d0fe"/>
    <circle cx="148" cy="122" r="7" fill="#a855f7"/>
    <circle cx="182" cy="122" r="7" fill="#a855f7"/>
    <path d="M148 148 q17 14 34 0" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <rect x="88" y="262" width="154" height="12" rx="6" fill="#e9d5ff"/>
    <text x="165" y="302" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#7e22ce">Live2D 交互</text>
  </g>

  <!-- 对话气泡 -->
  <g transform="translate(510 180)">
    <rect width="440" height="66" rx="16" fill="#fff" opacity=".95"/>
    <rect x="22" y="22" width="300" height="12" rx="6" fill="#e9d5ff"/>
    <rect x="22" y="42" width="210" height="10" rx="5" fill="#f3e8ff"/>
  </g>
  <g transform="translate(560 262)">
    <rect width="390" height="56" rx="14" fill="#a855f7" opacity=".16"/>
    <rect x="20" y="22" width="240" height="11" rx="6" fill="#c084fc"/>
  </g>

  <!-- 三个模块 -->
  <g transform="translate(510 350)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="200" height="140" rx="16" fill="#fff" opacity=".92" stroke="#e9d5ff" stroke-width="2"/>
    <text x="100" y="56" text-anchor="middle" font-size="30">💬</text>
    <text x="100" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">语音 / 文字交流</text>
    <text x="100" y="120" text-anchor="middle" font-size="13" fill="#a855f7">Web Speech</text>

    <rect x="222" width="200" height="140" rx="16" fill="#fff" opacity=".92" stroke="#e9d5ff" stroke-width="2"/>
    <text x="322" y="56" text-anchor="middle" font-size="30">📖</text>
    <text x="322" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">作品阅读</text>
    <text x="322" y="120" text-anchor="middle" font-size="13" fill="#a855f7">林语堂作品</text>

    <rect x="444" width="200" height="140" rx="16" fill="#fff" opacity=".92" stroke="#e9d5ff" stroke-width="2"/>
    <text x="544" y="56" text-anchor="middle" font-size="30">✂️</text>
    <text x="544" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">漳浦剪纸</text>
    <text x="544" y="120" text-anchor="middle" font-size="13" fill="#a855f7">风格迁移</text>
  </g>

  <text x="600" y="95" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#7e22ce" letter-spacing="2">AI · DIGITAL HUMAN</text>
</svg>
